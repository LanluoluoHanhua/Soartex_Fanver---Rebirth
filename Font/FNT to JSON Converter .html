<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft FNT 转换器 (完美版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; max-width: 850px; margin: 0 auto; }
        h1 { color: #569cd6; font-size: 1.5em; }
        .container { background-color: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #9cdcfe; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; background-color: #3c3c3c; border: 1px solid #555; color: #d4d4d4; border-radius: 4px; }
        button { background-color: #0e639c; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; width: 100%; font-weight: bold; }
        button:hover { background-color: #1177bb; }
        textarea { width: 100%; height: 350px; margin-top: 20px; padding: 10px; box-sizing: border-box; background-color: #1e1e1e; color: #b5cea8; border: 1px solid #555; border-radius: 4px; font-family: 'Courier New', Courier, monospace; resize: vertical; font-size: 14px; line-height: 1.4; }
        .tips { font-size: 0.85em; color: #888; margin-top: 5px; }
        .success { color: #4ec9b0; font-weight: bold; margin-top: 10px; display: none; }
        .stats { color: #ce9178; font-size: 0.9em; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <h1>Minecraft FNT 转换器 (完美版)</h1>
    <div class="container">
        <div class="form-group">
            <label for="fileInput">1. 上传 SnowB 导出的 .fnt 文件：</label>
            <input type="file" id="fileInput" accept=".fnt,.txt">
        </div>

        <div class="form-group">
            <label for="imagePath">2. 填写图片在资源包中的路径：</label>
            <input type="text" id="imagePath" value="minecraft:font/custom_font.png">
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="heightInput">3. 字体高度 (height，控制大小)：</label>
                <input type="number" id="heightInput" value="11" step="1">
                <div class="tips">建议为整数，越大字体越大</div>
            </div>
            <div class="col form-group">
                <label for="ascentInput">4. 基线高度 (ascent，控制上下)：</label>
                <input type="number" id="ascentInput" value="10" step="0.1">
                <div class="tips">可填小数，越大字体越靠上</div>
            </div>
        </div>

        <button id="convertBtn">5. 开始转换并生成 JSON</button>
        
        <div class="success" id="successMsg">✅ 转换成功！已转为单斜杠 \u 格式，并补齐了 \u0000。</div>
        <div class="stats" id="statsMsg"></div>

        <textarea id="outputJson" readonly placeholder="生成的 default.json 将显示在这里..."></textarea>
        <button id="downloadBtn" style="background-color: #2e7d32; display: none;">⬇️ 下载 default.json</button>
    </div>

    <script>
        let generatedJson = "";

        document.getElementById('convertBtn').addEventListener('click', () => {
            const fileInput = document.getElementById('fileInput');
            const imagePath = document.getElementById('imagePath').value.trim();
            const userHeight = parseFloat(document.getElementById('heightInput').value);
            const userAscent = parseFloat(document.getElementById('ascentInput').value);
            
            if (!fileInput.files.length) {
                alert("请先上传 .fnt 文件！");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const text = e.target.result;
                const data = parseFnt(text);
                
                if (data.chars.length === 0) {
                    alert("未在文件中找到有效的字符数据！");
                    return;
                }

                const jsonOutput = buildJson(data, imagePath, userHeight, userAscent);
                
                // 🌟 将序列化后的 \\u 替换回单斜杠 \u
                generatedJson = JSON.stringify(jsonOutput, null, 2).replace(/\\\\u/g, '\\u');
                
                document.getElementById('outputJson').value = generatedJson;
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'block';
            };

            reader.readAsText(file, 'UTF-8');
        });

        // 解析 .fnt 文件
        function parseFnt(text) {
            let lines = text.split('\n');
            let chars = [];

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('char ')) {
                    let idMatch = line.match(/id=(\d+)/);
                    let xMatch = line.match(/x=(\d+)/);
                    let yMatch = line.match(/y=(\d+)/);
                    let wMatch = line.match(/width=(\d+)/);
                    
                    if (idMatch && xMatch && yMatch) {
                        chars.push({
                            id: parseInt(idMatch[1]),
                            x: parseInt(xMatch[1]),
                            y: parseInt(yMatch[1]),
                            width: wMatch ? parseInt(wMatch[1]) : 0
                        });
                    }
                }
            }
            return { chars };
        }

        // 核心逻辑：转换为 \uXXXX 并补齐
        function buildJson(data, imagePath, userHeight, userAscent) {
            // 1. 按 Y 坐标分行，Y 相同则按 X 排序
            data.chars.sort((a, b) => {
                if (a.y === b.y) return a.x - b.x;
                return a.y - b.y;
            });

            let rows = {}; 
            for (let c of data.chars) {
                if (!rows[c.y]) rows[c.y] = [];
                rows[c.y].push(c);
            }

            let sortedYs = Object.keys(rows).map(Number).sort((a, b) => a - b);
            let finalRows = [];
            let maxRowLength = 0;

            // 2. 将每行的字符转为 \uXXXX
            for (let y of sortedYs) {
                let charLine = [];
                for (let c of rows[y]) {
                    let hex = c.id.toString(16).padStart(4, '0').toUpperCase();
                    charLine.push(`\\u${hex}`); 
                }
                finalRows.push(charLine);
                if (charLine.length > maxRowLength) {
                    maxRowLength = charLine.length;
                }
            }

            // 3. 补齐 \u0000 
            let charsArray = [];
            for (let line of finalRows) {
                let missingCount = maxRowLength - line.length;
                for (let i = 0; i < missingCount; i++) {
                    line.push('\\u0000'); 
                }
                charsArray.push(line.join(''));
            }

            // 🌟 使用用户输入的 height 和 ascent，并做安全兜底
            let safeHeight = isNaN(userHeight) || userHeight <= 0 ? 11 : userHeight;
            let safeAscent = isNaN(userAscent) ? 10 : userAscent;

            // 自动纠错 ascent 大于 height 的问题
            if (safeAscent > safeHeight) {
                safeAscent = Math.floor(safeHeight * 0.8);
            }

            // 显示统计信息
            const statsEl = document.getElementById('statsMsg');
            statsEl.style.display = 'block';
            statsEl.innerHTML = `📊 共解析 ${data.chars.length} 个字符，分 ${finalRows.length} 行，每行固定 ${maxRowLength} 个。<br>📏 当前生成参数：高度 height = <b>${safeHeight}</b>，基线 ascent = <b>${safeAscent}</b>`;

            // 4. 返回结构
            return {
                providers: [
                    {
                        type: "bitmap",
                        file: imagePath,
                        height: safeHeight,
                        ascent: safeAscent,
                        chars: charsArray
                    }
                ]
            };
        }

        // 下载功能
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!generatedJson) return;
            const blob = new Blob([generatedJson], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'default.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
