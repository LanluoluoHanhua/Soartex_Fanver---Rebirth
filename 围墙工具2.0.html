<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>围墙全套文件一键生成器 (支持批量)</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: #2b2b2b; color: #f0f0f0; padding: 40px; display: flex; justify-content: center; }
        .container { background-color: #3c3f41; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 500px; }
        h2 { text-align: center; margin-top: 0; color: #4CAF50; }
        input, textarea { width: 100%; padding: 10px; margin: 15px 0; box-sizing: border-box; border: 1px solid #555; background: #2b2b2b; color: #fff; border-radius: 5px; font-size: 16px; font-family: inherit; }
        textarea { min-height: 46px; line-height: 1.5; resize: none; overflow-y: hidden; white-space: pre-wrap; word-break: break-all; }
        textarea:focus { outline: none; border-color: #4CAF50; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        
        .download-section { margin-top: 20px; padding: 15px; border-radius: 8px; background: #2b2b2b; border: 1px solid #444; display: none; }
        .download-section h3 { margin: 0 0 10px 0; color: #81c784; font-size: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .dir-path { font-family: monospace; color: #aaa; font-size: 12px; display: block; margin-bottom: 10px; word-break: break-all; }
        
        .btn-download { display: block; text-align: center; color: white; padding: 10px; margin-bottom: 8px; text-decoration: none; border-radius: 5px; font-size: 14px; cursor: pointer; }
        .btn-blue { background: #007ACC; }
        .btn-blue:hover { background: #005a9e; }
        .btn-orange { background: #E67E22; }
        .btn-orange:hover { background: #d35400; }
        .btn-purple { background: #8E44AD; }
        .btn-purple:hover { background: #732d91; }
        .btn-green { background: #27AE60; }
        .btn-green:hover { background: #219150; }
        
        .sub-links { margin-top: 10px; font-size: 12px; text-align: center; }
        .sub-links a { color: #aaa; margin: 0 5px; text-decoration: underline; }
        .sub-links a:hover { color: #fff; }

        /* 批量下载列表的样式 */
        #items-dynamic-links { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .dynamic-link { background: #444; color: #ccc; padding: 6px; border-radius: 4px; text-decoration: none; font-size: 12px; text-align: center; border: 1px solid #555; }
        .dynamic-link:hover { background: #555; color: #fff; }

        .subtitle { text-align: center; color: #9e9e9e; font-size: 13px; letter-spacing: 1px; margin: -10px 0 20px 0; }
        .subtitle span { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>围墙生成器 (支持批量)</h2>
    <p class="subtitle">设计：<span>Lanluoluo</span>　制作：<span>Deepseek</span></p>
    <label for="blockName">请输入方块名称：</label>
    <textarea id="blockName" rows="1" placeholder="单个: packed_ice_brick&#10;多个: ice, cinnabar, copper（逗号或换行分隔，Ctrl+Enter 生成）" autocomplete="off"></textarea>
    <button onclick="generateFiles()">生成文件</button>
    
    <!-- 区块 1：方块状态 -->
    <div class="download-section" id="section-states">
        <h3>📁 目标文件夹：blockstates</h3>
        <span class="dir-path">assets\minecraft\blockstates\</span>
        <a id="dl-state" class="btn-download btn-blue" href="#" download>下载 方块状态文件</a>
    </div>

    <!-- 区块 2：模型文件 -->
    <div class="download-section" id="section-models">
        <h3>📁 目标文件夹：models\block\wall</h3>
        <span class="dir-path">assets\minecraft\models\block\wall\</span>
        <a id="dl-all-models" class="btn-download btn-orange" onclick="downloadAllModels()">一键下载 模型文件 (4个)</a>
        <div class="sub-links">
            单独下载：
            <a id="dl-inv" href="#" download>inventory</a> | 
            <a id="dl-post" href="#" download>post</a> | 
            <a id="dl-side" href="#" download>side</a> | 
            <a id="dl-side-tall" href="#" download>side_tall</a>
        </div>
    </div>

    <!-- 区块 3：物品指引文件 -->
    <div class="download-section" id="section-items">
        <h3>📁 目标文件夹：items</h3>
        <span class="dir-path">assets\minecraft\items\</span>
        <!-- 批量下载按钮 -->
        <a id="dl-all-items" class="btn-download btn-green" onclick="downloadAllItems()">一键下载所有 物品指引文件</a>
        <!-- 动态生成的单独下载列表 -->
        <div id="items-dynamic-links"></div>
    </div>
</div>

<script>
    let generatedFiles = {};

    // 输入框随内容自动增高
    const blockNameInput = document.getElementById('blockName');
    function autoResize(el) {
        const cs = getComputedStyle(el);
        const border = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
        el.style.height = 'auto';
        const maxH = 260;                                  // 超过这个高度就出现内部滚动条
        const need = el.scrollHeight + border;
        el.style.height = Math.min(need, maxH) + 'px';
        el.style.overflowY = need > maxH ? 'auto' : 'hidden';
    }
    blockNameInput.addEventListener('input', () => autoResize(blockNameInput));
    // Ctrl+Enter / Cmd+Enter 快捷生成（普通 Enter 仍然可以换行）
    blockNameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            generateFiles();
        }
    });
    autoResize(blockNameInput);

    function generateFiles() {
        let rawInput = document.getElementById('blockName').value.trim();
        if (!rawInput) {
            alert("请先输入方块名称！");
            return;
        }

        // 支持中英文逗号及换行分隔
        let names = rawInput.split(/[,，\r\n]+/).map(n => n.trim()).filter(n => n);
        let isBatch = names.length > 1;

        // 清理旧状态
        generatedFiles = {};
        document.getElementById('items-dynamic-links').innerHTML = '';
        
        // 隐藏所有区块，根据情况重新显示
        document.getElementById('section-states').style.display = 'none';
        document.getElementById('section-models').style.display = 'none';
        document.getElementById('section-items').style.display = 'none';

        let itemBtn = document.getElementById('dl-all-items');

        if (!isBatch) {
            // ==============================
            // 单输入模式：生成全套 6 个文件
            // ==============================
            let baseName = names[0];

            let stateJson = getStateJson(baseName);
            let sideJson = getSideJson(baseName);
            let sideTallJson = getSideTallJson(baseName);
            let postJson = getPostJson(baseName);
            let invJson = getInvJson(baseName);
            let itemJson = getItemJson(baseName);

            generatedFiles = {
                [`${baseName}_wall.json`]: stateJson,
                [`${baseName}_wall_inventory.json`]: invJson,
                [`${baseName}_wall_post.json`]: postJson,
                [`${baseName}_wall_side.json`]: sideJson,
                [`${baseName}_wall_side_tall.json`]: sideTallJson
            };

            bindDownloadLink('dl-state', `${baseName}_wall.json`, stateJson);
            bindDownloadLink('dl-inv', `${baseName}_wall_inventory.json`, invJson);
            bindDownloadLink('dl-post', `${baseName}_wall_post.json`, postJson);
            bindDownloadLink('dl-side', `${baseName}_wall_side.json`, sideJson);
            bindDownloadLink('dl-side-tall', `${baseName}_wall_side_tall.json`, sideTallJson);

            document.getElementById('section-states').style.display = 'block';
            document.getElementById('section-models').style.display = 'block';
            document.getElementById('section-items').style.display = 'block';

            // 单个物品文件：只靠 href 下载，移除批量下载的 onclick，避免把 blockstate 也当 item 下下来
            itemBtn.removeAttribute('onclick');
            itemBtn.setAttribute('href', '#');
            itemBtn.setAttribute('download', '');
            bindDownloadLink('dl-all-items', `${baseName}_wall.json`, itemJson);
            itemBtn.innerText = "下载 物品指引文件";

        } else {
            // ==============================
            // 批量模式：仅生成 items 目录下的文件
            // ==============================
            let dynamicContainer = document.getElementById('items-dynamic-links');

            names.forEach((baseName, index) => {
                let itemJson = getItemJson(baseName);
                let filename = `${baseName}_wall.json`;
                
                // 存入对象，供一键下载使用
                generatedFiles[filename] = itemJson;

                // 创建单独的下载链接，方便用户手动点击
                let a = document.createElement('a');
                a.className = 'dynamic-link';
                a.textContent = `单独下载: ${filename}`;
                let blob = new Blob([itemJson], { type: 'application/json' });
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                dynamicContainer.appendChild(a);
            });

            document.getElementById('section-items').style.display = 'block';

            // 批量模式：挂回一键下载，并清掉单输入时留下的 href，避免跟随旧 blob 再下一次
            itemBtn.setAttribute('onclick', 'downloadAllItems()');
            itemBtn.removeAttribute('href');
            itemBtn.removeAttribute('download');
            itemBtn.innerText = `一键下载 批量指引文件 (${names.length}个)`;
        }
    }

    // --- 绑定单个下载链接的辅助函数 ---
    function bindDownloadLink(id, filename, content) {
        let link = document.getElementById(id);
        let blob = new Blob([content], { type: 'application/json' });
        link.href = URL.createObjectURL(blob);
        link.download = filename;
    }

    // --- 触发一键下载全部 Items（仅在批量模式下调用）---
    function downloadAllItems() {
        let count = 0;
        for (let filename in generatedFiles) {
            // 只下载名字形如 xxx_wall.json 的文件
            if (filename.endsWith('_wall.json')) {
                let blob = new Blob([generatedFiles[filename]], { type: 'application/json' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                count++;
            }
        }
        if (count > 0) {
            alert(`已触发 ${count} 个物品指引文件下载！\n如果浏览器提示“阻止多个文件下载”，请点击允许，或使用下方列表单独下载。`);
        }
    }

    // --- 触发一键下载 4 个模型 ---
    function downloadAllModels() {
        let baseName = document.getElementById('blockName').value.trim().split(/[,，\r\n]+/)[0].trim();
        let modelFiles = [
            `${baseName}_wall_inventory.json`,
            `${baseName}_wall_post.json`,
            `${baseName}_wall_side.json`,
            `${baseName}_wall_side_tall.json`
        ];
        
        let count = 0;
        for (let filename of modelFiles) {
            if (generatedFiles[filename]) {
                let blob = new Blob([generatedFiles[filename]], { type: 'application/json' });
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                count++;
            }
        }
        if (count > 0) alert(`已触发 ${count} 个模型文件下载！`);
    }

    // ================== 模板生成函数 ==================
    function getStateJson(baseName) {
        return `{
    "multipart": [
        {   "when": { "up": "true" },
            "apply": { "model": "block/wall/${baseName}_wall_post" }
        },
        {   "when": { "north": "low" },
            "apply": { "model": "block/wall/${baseName}_wall_side", "uvlock": true }
        },
        {   "when": { "east": "low" },
            "apply": { "model": "block/wall/${baseName}_wall_side", "y": 90, "uvlock": true }
        },
        {   "when": { "south": "low" },
            "apply": { "model": "block/wall/${baseName}_wall_side", "y": 180, "uvlock": true }
        },
        {   "when": { "west": "low" },
            "apply": { "model": "block/wall/${baseName}_wall_side", "y": 270, "uvlock": true }
        },
        {   "when": { "north": "tall" },
            "apply": { "model": "block/wall/${baseName}_wall_side_tall", "uvlock": true }
        },
        {   "when": { "east": "tall" },
            "apply": { "model": "block/wall/${baseName}_wall_side_tall", "y": 90, "uvlock": true }
        },
        {   "when": { "south": "tall" },
            "apply": { "model": "block/wall/${baseName}_wall_side_tall", "y": 180, "uvlock": true }
        },
        {   "when": { "west": "tall" },
            "apply": { "model": "block/wall/${baseName}_wall_side_tall", "y": 270, "uvlock": true }
        }
    ]
}`;
    }

    function getSideJson(baseName) {
        return `{
    "parent": "block/wall/wall_side",
    "textures": {
        "side": "block/wall/${baseName}/wall_side",
        "top": "block/wall/${baseName}/wall_top",
        "normal": "block/${baseName}"
    }
}`;
    }

    function getSideTallJson(baseName) {
        return `{
    "parent": "block/wall/wall_side_tall",
    "textures": {
        "side": "block/wall/${baseName}/wall_side_tall",
        "top": "block/wall/${baseName}/wall_top",
        "normal": "block/${baseName}"
    }
}`;
    }

    function getPostJson(baseName) {
        return `{
    "parent": "block/wall/wall_post",
    "textures": {
        "side": "block/wall/${baseName}/post_side",
        "top": "block/wall/${baseName}/post_top",
        "normal": "block/${baseName}"
    }
}`;
    }

    function getInvJson(baseName) {
        return `{
    "parent": "block/wall/wall_inventory",
    "textures": {
        "wall": "block/${baseName}",
        "side": "block/wall/${baseName}/wall_side",
        "top": "block/wall/${baseName}/wall_top",
        "post_top": "block/wall/${baseName}/post_top",
        "post_side": "block/wall/${baseName}/post_side"
    },
    "display": {
        "gui": { "rotation": [ 30, 135, 0], "translation": [ 0, 0, 0], "scale":[ 0.625, 0.625, 0.625 ] },
        "ground": { "rotation": [ 0, 0, 0 ], "translation": [ 0, 3, 0], "scale":[ 0.25, 0.25, 0.25 ] },
        "fixed": { "rotation": [ 0, 0, 0 ], "translation": [ 0, 0, 0], "scale":[ 0.5, 0.5, 0.5 ] },
        "thirdperson_righthand": { "rotation": [ 75, 45, 0 ], "translation": [ 0, 2.5, 0], "scale": [ 0.375, 0.375, 0.375 ] },
        "firstperson_righthand": { "rotation": [ 0, 45, 0 ], "translation": [ 0, 0, 0 ], "scale": [ 0.40, 0.40, 0.40 ] },
        "firstperson_lefthand": { "rotation": [ 0, 225, 0 ], "translation": [ 0, 0, 0 ], "scale": [ 0.40, 0.40, 0.40 ] }
    }
}`;
    }

    function getItemJson(baseName) {
        return `{
    "model": {
        "type": "minecraft:model",
        "model": "minecraft:block/wall/${baseName}_wall_inventory"
    }
}`;
    }
</script>

</body>
</html>
